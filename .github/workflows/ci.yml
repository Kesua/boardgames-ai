name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          grep -v "^torch==" requirements.lock > /tmp/req.txt
          pip install "torch==$(grep '^torch==' requirements.lock | sed 's/torch==//; s/+.*//')" --index-url https://download.pytorch.org/whl/cpu
          pip install -r /tmp/req.txt
      - name: Repository rules
        run: python tools/check_repo.py
      - name: Tests
        run: python -m pytest -q
      - name: Engine checks (short)
        run: |
          for g in $(ls games | grep -v '^_' | grep -v '^__'); do python -m bgai.checks --game $g --games 300 --no-write; done
      - name: Fingerprint replay (first 20 games of every experiment)
        run: python tools/regenerate.py --game all --check-only
      - name: Build the site
        run: python tools/build_site.py

  pages:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          pip install numpy pandas
          pip install "torch==$(grep '^torch==' requirements.lock | sed 's/torch==//; s/+.*//')" --index-url https://download.pytorch.org/whl/cpu
          pip install sb3-contrib gymnasium
          python tools/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
